    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,400;1,600&family=JetBrains+Mono:wght@400;500&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      // Automatic GitHub Pages Root-Branch Bootloader:
      // When deployed directly from a GitHub repo branch (e.g. aadinachikketh.github.io/shoot/)
      // without a Vite build step, browsers cannot execute raw ./src/main.tsx.
      // This loader automatically boots the precompiled production bundle in ./public/gh-pages-app.js.
      window.__bootGhPagesFallback = function () {
        if (window.__LUMIERE_MOUNTED__ || window.__LUMIERE_FALLBACK_LOADING__) return;
        window.__LUMIERE_FALLBACK_LOADING__ = true;

        var css = document.createElement('link');
        css.rel = 'stylesheet';
        css.href = './public/gh-pages-app.css';
        css.onerror = function () {
          var altCss = document.createElement('link');
          altCss.rel = 'stylesheet';
          altCss.href = './gh-pages-app.css';
          document.head.appendChild(altCss);
        };
        document.head.appendChild(css);

        var script = document.createElement('script');
        script.type = 'module';
        script.src = './public/gh-pages-app.js';
        script.onerror = function () {
          var altScript = document.createElement('script');
          altScript.type = 'module';
          altScript.src = './gh-pages-app.js';
          document.body.appendChild(altScript);
        };
        document.body.appendChild(script);
      };
    </script>
  </head>
  <body class="bg-[#FAFAFA] text-zinc-900 antialiased selection:bg-zinc-900 selection:text-white">
    <div id="root"></div>
    <script
      type="module"
      src="./src/main.tsx"
      onerror="window.__bootGhPagesFallback()"
    ></script>
    <script>
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (!window.__LUMIERE_MOUNTED__) {
            window.__bootGhPagesFallback();
          }
        }, 400);
      });
    </script>
  </body>
</html>
